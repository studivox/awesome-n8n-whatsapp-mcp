name: Validate Repository

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Run validator unit tests
        run: python3 scripts/test_validate_repository.py

      - name: Run repository validator
        run: python3 scripts/validate_repository.py

      - name: Check for whitespace/conflict-marker errors
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD
